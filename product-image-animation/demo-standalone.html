  <title>Silver Chain Product Image</title>
  <style>
/* Product image: reveal on load, one-time silver sheen, hover-to-inspect zoom. */
:root {
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
}

.pz {
  position: relative;
  overflow: hidden;
  aspect-ratio: 1 / 1;
  background: #fff;
}

.pz__img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform-origin: 0 0;
  transition:
    opacity 300ms var(--ease-out),
    transform 300ms var(--ease-out);
}

/* Hidden only once JS is running, so the image never stays invisible without it. */
.pz.is-armed:not(.is-loaded) .pz__img {
  opacity: 0;
  transform: scale(0.97);
}

.pz.is-loaded .pz__img {
  opacity: 1;
  transform: none;
}

/* Sheen: a soft diagonal highlight that crosses the metal once after reveal. */
.pz::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(
    115deg,
    transparent 35%,
    rgba(255, 255, 255, 0.55) 50%,
    transparent 65%
  );
  mix-blend-mode: soft-light;
  transform: translateX(-100%);
}

.pz.is-loaded::after {
  animation: pz-sheen 900ms var(--ease-in-out) 250ms 1 both;
}

@keyframes pz-sheen {
  to { transform: translateX(100%); }
}

/* Zoom only where hover is real; touch gets the native pinch/gallery. */
@media (hover: hover) and (pointer: fine) {
  .pz { cursor: zoom-in; }
  .pz.is-zooming .pz__img {
    /* JS sets transform directly; this transition makes the pan trail the cursor smoothly. */
    transition: transform 200ms var(--ease-out);
  }
}

@media (prefers-reduced-motion: reduce) {
  .pz__img { transition: opacity 200ms ease; }
  .pz.is-armed:not(.is-loaded) .pz__img { transform: none; }
  .pz.is-loaded::after { animation: none; }
  .pz.is-zooming .pz__img { transition: none; }
}
</style>

  <script>
// Usage: <div class="pz" data-zoom="2"><img class="pz__img" src="..." alt="..."></div>
(function () {
  const canHover = window.matchMedia('(hover: hover) and (pointer: fine)');

  function init(root) {
    const img = root.querySelector('.pz__img');
    if (!img) return;

    const reveal = () => requestAnimationFrame(() => root.classList.add('is-loaded'));
    if (img.complete && img.naturalWidth) {
      root.classList.add('is-loaded');
    } else {
      root.classList.add('is-armed');
      img.addEventListener('load', reveal, { once: true });
      img.addEventListener('error', reveal, { once: true });
    }

    const scale = parseFloat(root.dataset.zoom) || 2;

    function pan(e) {
      const r = root.getBoundingClientRect();
      const fx = Math.min(Math.max((e.clientX - r.left) / r.width, 0), 1);
      const fy = Math.min(Math.max((e.clientY - r.top) / r.height, 0), 1);
      const tx = -(scale - 1) * fx * r.width;
      const ty = -(scale - 1) * fy * r.height;
      img.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
    }

    root.addEventListener('pointerenter', (e) => {
      if (!canHover.matches || e.pointerType !== 'mouse') return;
      root.classList.add('is-zooming');
      pan(e);
    });
    root.addEventListener('pointermove', (e) => {
      if (root.classList.contains('is-zooming')) pan(e);
    });
    root.addEventListener('pointerleave', () => {
      // The base .pz__img transition eases the zoom-out back to rest.
      root.classList.remove('is-zooming');
      img.style.transform = '';
    });
  }

  document.querySelectorAll('.pz').forEach(init);
})();
</script>
